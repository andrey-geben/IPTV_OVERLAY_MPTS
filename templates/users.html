{% extends "base.html" %}
{% block title %}Пользователи — {{ config.APP_NAME }}{% endblock %}
{% block content %}
<section class="panel">
    <h2 class="panel__title"><span class="led led--on"></span>УПРАВЛЕНИЕ ПОЛЬЗОВАТЕЛЯМИ</h2>
    <div class="actions" style="margin-bottom: 20px;">
        <input type="text" id="new-username" placeholder="Логин" style="width:200px;">
        <input type="password" id="new-password" placeholder="Пароль" style="width:200px;">
        <select id="new-role" style="width:150px;">
            <option value="operator">Operator</option>
            <option value="viewer">Viewer</option>
            <option value="admin">Admin</option>
        </select>
        <button class="btn btn--primary" onclick="createUser()">ДОБАВИТЬ</button>
    </div>
    <table>
        <thead><tr><th>Логин</th><th>Роль</th><th>Действия</th></tr></thead>
        <tbody id="users-body"></tbody>
    </table>
</section>
<script>
async function loadUsers() {
    const r = await fetch("/api/users");
    const data = await r.json();
    const tbody = document.getElementById("users-body");
    tbody.innerHTML = "";
    if (!data.users) return;
    data.users.forEach(u => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${u.username}</td><td>${u.role}</td>
        <td><button class="btn btn--danger btn--small" onclick="deleteUser('${u.username}')">Удалить</button></td>`;
        tbody.appendChild(tr);
    });
}
async function createUser() {
    const username = document.getElementById("new-username").value.trim();
    const password = document.getElementById("new-password").value;
    const role = document.getElementById("new-role").value;
    if (!username || !password) return alert("Введите логин и пароль");
    const r = await fetch("/api/users", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password, role })
    });
    const data = await r.json();
    if (data.ok) { loadUsers(); document.getElementById("new-password").value = ""; }
    else alert(data.error);
}
async function deleteUser(username) {
    if (!confirm(`Удалить пользователя ${username}?`)) return;
    const r = await fetch(`/api/users/${username}`, { method: "DELETE" });
    const data = await r.json();
    if (data.ok) loadUsers(); else alert(data.error);
}
loadUsers();
</script>
{% endblock %}
