<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Смена пароля — {{ config.APP_NAME }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="login-wrap">
        <div class="login-panel">
            <div class="login-brand">
                <span class="led led--warn led--pulse"></span>
                СМЕНА ПАРОЛЯ
            </div>
            <div class="login-subtitle">ПЕРВЫЙ ВХОД</div>
            <div class="test-stripe"></div>

            <div class="alert alert--error" style="margin-bottom:14px;">
                <span class="led led--err"></span>
                Вы используете пароль по умолчанию <code>admin</code>. Смените его, чтобы продолжить.
            </div>

            <form id="password-form">
                <label class="field-label" for="new-password">Новый пароль</label>
                <input id="new-password" type="password" autocomplete="new-password" minlength="6" autofocus required>

                <label class="field-label" for="new-password-2" style="margin-top:12px;">Повторите пароль</label>
                <input id="new-password-2" type="password" autocomplete="new-password" minlength="6" required>

                <div id="error-msg" class="alert alert--error" style="display:none; margin-top:12px;">
                    <span class="led led--err"></span>
                    <span id="error-text"></span>
                </div>

                <div class="actions" style="margin-top:18px;">
                    <button type="submit" class="btn btn--primary" style="flex:1;">▶ УСТАНОВИТЬ ПАРОЛЬ</button>
                </div>
            </form>

            <div class="login-hint">
                <a href="{{ url_for('logout_page') }}">Выйти</a>
            </div>

            <div class="login-footer">© {{ current_year }} {{ config.AUTHOR }} · v{{ config.VERSION }}</div>
        </div>
    </div>

<script>
function showError(msg) {
    document.getElementById("error-text").textContent = msg;
    document.getElementById("error-msg").style.display = "flex";
}

document.getElementById("password-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const p1 = document.getElementById("new-password").value;
    const p2 = document.getElementById("new-password-2").value;

    if (p1.length < 6) return showError("Пароль должен быть не короче 6 символов");
    if (p1 !== p2) return showError("Пароли не совпадают");

    try {
        const r = await fetch("/api/auth/change-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ new_password: p1 }),
        });
        const data = await r.json();
        if (data.ok) {
            window.location.href = "/";
        } else {
            showError(data.error || "Не удалось сохранить пароль");
        }
    } catch (err) {
        showError("Сетевая ошибка: " + err.message);
    }
});
</script>
</body>
</html>
